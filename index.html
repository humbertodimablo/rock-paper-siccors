<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="index.css"> 
  
</head> 

<body>

<header>Rock Paper Scissors</header>
<div class="scoreboard">
  <div>
    <div>Player Score</div>
    <div id="playerScore">0</div>
  </div>
  <div>
    <div>Computer Score</div>
    <div id="computerScore">0</div>
  </div>
</div>
<div class="choices" role="group" aria-label="Choose your play">
  <button class="choice-btn" data-choice="Rock" aria-label="Choose Rock">✊</button>
  <button class="choice-btn" data-choice="Paper" aria-label="Choose Paper">✋</button>
  <button class="choice-btn" data-choice="Scissors" aria-label="Choose Scissors">✌️</button>
</div>
<div class="winner-message" id="winnerMessage" aria-live="polite"></div>
<div class="rounds-container" id="roundsContainer" aria-label="Game rounds history">
</div>
<button class="reset-btn" id="resetBtn" style="display:none;">Play Again</button>


    </body>
    <script src="index.js"></script>
</html>
